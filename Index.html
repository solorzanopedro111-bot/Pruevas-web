<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        h1 { text-align: center; color: #333; }
        .product-grid { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .product-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 200px; text-align: center; }
        .product-card img { max-width: 100%; height: auto; border-radius: 4px; }
        .price { color: #27ae60; font-weight: bold; font-size: 1.25em; margin: 10px 0; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #2980b9; }
    </style>
</head>
<body>

    <h1>Nuestros Productos</h1>

    <div class="product-grid">
        <div class="product-card">
            <img src="https://via.placeholder.com/150" alt="Producto 1">
            <h3>Producto Uno</h3>
            <p>Descripción breve del producto.</p>
            <div class="price">$50.000</div>
            <button>Comprar</button>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/150" alt="Producto 2">
            <h3>Producto Dos</h3>
            <p>Descripción breve del producto.</p>
            <div class="price">$80.000</div>
            <button>Comprar</button>
        </div>
    </div>

</body>
</html>
